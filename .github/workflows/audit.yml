name: Dependency audit

# Watches the dependency tree for newly published advisories. Runs on every PR, and
# weekly on top of that: advisories appear against dependencies nobody touched, so the
# schedule catches what no PR would.
#
# Findings are reported, not blocked: a tracking issue is opened (and kept up to date,
# and closed again when the tree is clean), and PRs that change dependencies get a
# comment. The job itself only fails on a CRITICAL advisory in a production dependency,
# so a red mark here always means "this ships to users and needs attention now".
on:
  schedule:
    - cron: "0 2 * * 1" # ทุกวันจันทร์ 09:00 ตามเวลาไทย (02:00 UTC)
  pull_request:
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci` — npm audit resolves the tree straight from package-lock.json, which
      # keeps this job under a minute. `|| true` because npm exits non-zero whenever it
      # finds anything, and the report step is what decides whether that matters.
      - name: Run npm audit
        run: |
          mkdir -p .ci
          npm audit --json > .ci/audit-all.json || true
          npm audit --omit=dev --json > .ci/audit-prod.json || true

      - name: Build report
        id: report
        run: node .github/workflows/audit-report.mjs

      # Scheduled and manual runs have no PR to talk to, so findings live in a single
      # tracking issue that is rewritten in place rather than re-opened every week.
      - name: Update tracking issue
        if: github.event_name != 'pull_request' && steps.report.outputs.status != 'error'
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.report.outputs.status }}
          TOTAL: ${{ steps.report.outputs.total }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.ci/audit.md', 'utf8');
            const marker = '<!-- npm-audit-comment -->';
            const { owner, repo } = context.repo;
            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = open.find(i => !i.pull_request && i.body && i.body.includes(marker));

            if (process.env.STATUS === 'clean') {
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                  body: '✅ ช่องโหว่ทั้งหมดถูกแก้แล้ว — ปิดอัตโนมัติ' });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              }
              return;
            }

            const title = `⚠️ npm audit: พบช่องโหว่ ${process.env.TOTAL} รายการใน dependencies`;
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body });
            } else {
              const { data: issue } = await github.rest.issues.create({ owner, repo, title, body, labels: ['dependencies'] });
              // Best-effort: assignment fails on org repos where the owner is not a user,
              // and that must not fail the run — the issue itself is the notification.
              try {
                await github.rest.issues.addAssignees({ owner, repo, issue_number: issue.number, assignees: [owner] });
              } catch (e) {
                core.warning(`assign failed: ${e.message}`);
              }
            }

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.report.outputs.status != 'error'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.ci/audit.md', 'utf8');
            const marker = '<!-- npm-audit-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Summary
        if: always()
        run: cat .ci/audit.md >> "$GITHUB_STEP_SUMMARY"

      # An audit that could not run is a broken check, not a clean tree — fail loudly
      # rather than let a silent "no findings" pass for good news.
      - name: Fail if the audit could not run
        if: steps.report.outputs.status == 'error'
        run: |
          echo "::error::npm audit ไม่คืนผลที่อ่านได้ — ตรวจ log ด้านบน"
          exit 1

      # Only critical-in-production is worth a red X. Everything else is already visible
      # in the issue/comment, and a check that is permanently red gets ignored.
      - name: Fail on critical production advisories
        if: steps.report.outputs.critical_prod != '0'
        run: |
          echo "::error::พบช่องโหว่ระดับ critical ${{ steps.report.outputs.critical_prod }} รายการใน production dependencies"
          exit 1
